<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: transparent; font-family: Arial, sans-serif; user-select: none; }

.player-box {
    max-width: 620px; margin: auto; background: #d9efff;
    border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    padding: 20px;
}

.now-playing { display: flex; gap: 20px; align-items: center; }

/* 유튜브 플레이어 영역 (노션 차단 방지용 크기 지정) */
.yt-frame-container {
    width: 150px;
    height: 150px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    background: #000;
}
.yt-frame-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.info { flex: 1; min-width: 0; }
.title { font-size: 20px; font-weight: bold; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subtitle { color: #6b8296; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.controls { margin-top: 16px; display: flex; align-items: center; gap: 8px; }
.btn {
    border: none; background: #4aa8ff; color: white; border-radius: 50%;
    width: 38px; height: 38px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
}
.btn:hover { background: #3294ee; }

/* 재생바 */
.progress-area { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.progress { flex: 1; height: 8px; background: #cfdde8; border-radius: 50px; cursor: pointer; position: relative; }
#progressBar { width: 0%; height: 100%; background: #4aa8ff; border-radius: 50px; position: relative; }
#progressBar::after {
    content: ""; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: #288df0;
}
.time-text { width: 45px; font-size: 12px; color: #5b7288; text-align: center; }

/* 플레이리스트 */
.playlist { background: #c7e6fa; padding: 12px; border-radius: 14px; margin-top: 18px; }
.track {
    display: flex; align-items: center; gap: 12px; padding: 10px;
    cursor: pointer; border-radius: 10px; transition: background 0.2s;
}
.track img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-desc { font-size: 12px; color: #6d8295; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media(max-width: 600px) {
    .now-playing { flex-direction: column; text-align: center; }
    .yt-frame-container { width: 180px; height: 180px; }
    .controls { justify-content: center; }
}
</style>
</head>
<body>

<div class="player-box">
    <div class="now-playing">
        <div class="yt-frame-container">
            <div id="youtube-player"></div>
        </div>
        <div class="info">
            <div id="main-title" class="title">로딩 중...</div>
            <div id="main-subtitle" class="subtitle">잠시만 기다려주세요</div>
            
            <div class="controls">
                <button class="btn" onclick="changeTrack(-1)">⏮</button>
                <button id="playBtn" class="btn" onclick="playPause()">▶</button>
                <button class="btn" onclick="changeTrack(1)">⏭</button>
            </div>

            <div class="progress-area">
                <span id="currentTime" class="time-text">0:00</span>
                <div class="progress" onclick="seek(event)">
                    <div id="progressBar"></div>
                </div>
                <span id="duration" class="time-text">0:00</span>
            </div>
        </div>
    </div>

    <div id="playlist" class="playlist"></div>
</div>

<script>
const tracks = [
    { id: "rR-cvnco5sY", title: "Somply", subtitle: "Feel-Good Jazz Playlist" },
    { id: "V4zgJOsfIYM", title: "Somply", subtitle: "Crystal Clear Dream Wave Jazz" }
];

let current = 0;
let player = null;
let isReady = false;
let timer = null;

const getThumb = (id) => `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

// 유튜브 Iframe API 로드
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

function onYouTubeIframeAPIReady() {
    player = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: tracks[0].id,
        host: 'https://www.youtube-nocookie.com', // 🚨 노션 보안 우회용 설정
        playerVars: {
            'autoplay': 0,
            'controls': 1,
            'rel': 0,
            'playsinline': 1,
            'enablejsapi': 1
        },
        events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
        }
    });
}

function onPlayerReady() {
    isReady = true;
    updateUI();
}

function onPlayerStateChange(event) {
    const playBtn = document.getElementById("playBtn");
    if (event.data === YT.PlayerState.PLAYING) {
        playBtn.innerText = "⏸";
        startTimer();
    } else {
        playBtn.innerText = "▶";
        stopTimer();
        if (event.data === YT.PlayerState.ENDED) {
            changeTrack(1);
        }
    }
}

function playPause() {
    if (!isReady || !player) return;
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
    } else {
        player.playVideo();
    }
}

function changeTrack(dir) {
    current = (current + dir + tracks.length) % tracks.length;
    selectTrack(current);
}

function selectTrack(index) {
    current = index;
    updateUI();
    if (isReady && player && player.loadVideoById) {
        player.loadVideoById(tracks[current].id);
    }
}

function updateUI() {
    const track = tracks[current];
    document.getElementById("main-title").innerText = track.title;
    document.getElementById("main-subtitle").innerText = track.subtitle;

    const playlistEl = document.getElementById("playlist");
    playlistEl.innerHTML = tracks.map((t, i) => `
        <div class="track" style="background: ${i === current ? '#ffffff' : 'transparent'};" onclick="selectTrack(${i})">
            <img src="${getThumb(t.id)}">
            <div>
                <div class="track-title">${t.title}</div>
                <div class="track-desc">${t.subtitle}</div>
            </div>
        </div>
    `).join('');
}

function startTimer() {
    stopTimer();
    timer = setInterval(updateProgress, 300);
}

function stopTimer() {
    if (timer) clearInterval(timer);
    timer = null;
}

function updateProgress() {
    if (!isReady || !player || !player.getCurrentTime) return;
    const cur = player.getCurrentTime() || 0;
    const tot = player.getDuration() || 0;
    
    if (tot > 0) {
        const pct = (cur / tot) * 100;
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("currentTime").innerText = formatTime(cur);
        document.getElementById("duration").innerText = formatTime(tot);
    }
}

function seek(e) {
    if (!isReady || !player || !player.getDuration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const targetTime = player.getDuration() * pct;
    player.seekTo(targetTime, true);
}

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
}

updateUI();
</script>
</body>
</html>
