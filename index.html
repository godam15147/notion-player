<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 💡 구글 웹폰트 (Times New Roman 호환) 로드 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* 💡 모든 요소에 Times New Roman / Tinos 폰트 강제 적용 */
* { 
    box-sizing: border-box; 
    font-family: 'Tinos', 'Times New Roman', Times, serif !important; 
    box-shadow: none !important;
}
body { margin: 0; background: transparent; user-select: none; }

/* 여백 최적화 */
.player-box {
    position: relative;
    max-width: 620px; margin: auto; background: #d9efff;
    border-radius: 20px; overflow: hidden;
    padding: 14px 16px;
}

/* 🚨 1회성 언락 오버레이 */
#unlock-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #4aa8ff;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: pointer;
    border-radius: 20px;
    transition: opacity 0.3s ease;
    text-align: center;
    padding: 10px;
}
#unlock-overlay h3 { margin: 0 0 6px 0; font-size: 18px; }
#unlock-overlay p { margin: 0; font-size: 13px; opacity: 0.9; }

.yt-hidden-wrapper {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.001;
}
.yt-hidden-wrapper iframe { width: 100%; height: 100%; border: none; }

/* 메인 UI */
.now-playing { display: flex; gap: 14px; align-items: center; }
.thumbnail { width: 110px; height: 110px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
.info { flex: 1; min-width: 0; }
.title { font-size: 18px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subtitle { color: #6b8296; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.controls { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
.btn {
    border: none; background: #4aa8ff; color: white; border-radius: 50%;
    width: 34px; height: 34px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
}
.btn:hover { background: #3294ee; }

/* 재생바 공간 */
.progress-area { display: flex; align-items: center; gap: 6px; margin-top: 12px; width: 100%; }
.progress { flex: 1; min-width: 50px; height: 8px; background: #cfdde8; border-radius: 50px; cursor: pointer; position: relative; }
#progressBar { width: 0%; height: 100%; background: #4aa8ff; border-radius: 50px; position: relative; }
#progressBar::after {
    content: ""; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: #288df0;
}
.time-text { min-width: 55px; font-size: 11px; color: #5b7288; text-align: center; flex-shrink: 0; }

/* 플레이리스트 */
.playlist { background: #c7e6fa; padding: 10px; border-radius: 14px; margin-top: 14px; }
.track {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    cursor: pointer; border-radius: 10px; transition: background 0.2s;
}
.track img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.track-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-desc { font-size: 11px; color: #6d8295; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media(max-width: 600px) {
    .now-playing { flex-direction: column; text-align: center; }
    .thumbnail { width: 130px; height: 130px; }
    .controls { justify-content: center; }
}
</style>
</head>
<body>

<div class="player-box">
    <div id="unlock-overlay">
        <h3>🎵Music Player🎵</h3>
        <p>Click anywhere to start playing</p>
        <div class="yt-hidden-wrapper">
            <div id="youtube-player"></div>
        </div>
    </div>

    <div class="now-playing">
        <img id="main-thumb" class="thumbnail">
        <div class="info">
            <div id="main-title" class="title">Loading...</div>
            <div id="main-subtitle" class="subtitle">Please wait</div>
            
            <div class="controls">
                <button class="btn" onclick="changeTrack(-1)">⏮</button>
                <button id="playBtn" class="btn" onclick="playPause()">▶</button>
                <button class="btn" onclick="changeTrack(1)">⏭</button>
            </div>

            <div class="progress-area">
                <span id="currentTime" class="time-text">0:00:00</span>
                <div class="progress" onclick="seek(event)">
                    <div id="progressBar"></div>
                </div>
                <span id="duration" class="time-text">0:00:00</span>
            </div>
        </div>
    </div>

    <div id="playlist" class="playlist"></div>
</div>

<script>
const tracks = [
    { id: "rR-cvnco5sY", title: "Somply", subtitle: "Feel-Good Jazz Playlist" },
    { id: "V4zgJOsfIYM", title: "Somply", subtitle: "Crystal Clear Dream Wave Jazz" }
];

let current = 0;
let player = null;
let isUnlocked = false;
let timer = null;

const getThumb = (id) => `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

function onYouTubeIframeAPIReady() {
    player = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: tracks[0].id,
        playerVars: {
            'autoplay': 0,
            'controls': 0,
            'rel': 0,
            'playsinline': 1
        },
        events: {
            'onStateChange': onPlayerStateChange
        }
    });
}

function onPlayerStateChange(event) {
    const playBtn = document.getElementById("playBtn");
    
    if (event.data === YT.PlayerState.PLAYING) {
        if (!isUnlocked) {
            isUnlocked = true;
            const overlay = document.getElementById("unlock-overlay");
            overlay.style.opacity = "0";
            setTimeout(() => overlay.style.display = "none", 300);
        }
        playBtn.innerText = "⏸";
        startTimer();
    } else {
        playBtn.innerText = "▶";
        stopTimer();
        if (event.data === YT.PlayerState.ENDED) {
            changeTrack(1);
        }
    }
    updateProgress();
}

function playPause() {
    if (!player || !player.getPlayerState) return;
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
    } else {
        player.playVideo();
    }
}

function changeTrack(dir) {
    current = (current + dir + tracks.length) % tracks.length;
    selectTrack(current);
}

function selectTrack(index) {
    current = index;
    updateUI();
    if (player && player.loadVideoById) {
        player.loadVideoById(tracks[current].id);
    }
}

function updateUI() {
    const track = tracks[current];
    document.getElementById("main-title").innerText = track.title;
    document.getElementById("main-subtitle").innerText = track.subtitle;
    document.getElementById("main-thumb").src = getThumb(track.id);

    const playlistEl = document.getElementById("playlist");
    playlistEl.innerHTML = tracks.map((t, i) => `
        <div class="track" style="background: ${i === current ? '#ffffff' : 'transparent'};" onclick="selectTrack(${i})">
            <img src="${getThumb(t.id)}">
            <div>
                <div class="track-title">${t.title}</div>
                <div class="track-desc">${t.subtitle}</div>
            </div>
        </div>
    `).join('');
}

function startTimer() {
    stopTimer();
    timer = setInterval(updateProgress, 300);
}

function stopTimer() {
    if (timer) clearInterval(timer);
    timer = null;
}

function updateProgress() {
    if (!player || !player.getCurrentTime) return;
    const cur = player.getCurrentTime() || 0;
    const tot = player.getDuration() || 0;
    
    document.getElementById("currentTime").innerText = formatTime(cur);
    document.getElementById("duration").innerText = formatTime(tot);

    if (tot > 0) {
        const pct = (cur / tot) * 100;
        document.getElementById("progressBar").style.width = pct + "%";
    }
}

function seek(e) {
    if (!player || !player.getDuration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const targetTime = player.getDuration() * pct;
    player.seekTo(targetTime, true);
    
    document.getElementById("currentTime").innerText = formatTime(targetTime);
    document.getElementById("progressBar").style.width = (pct * 100) + "%";
}

function formatTime(sec) {
    sec = Math.floor(sec || 0);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;

    return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

updateUI();
</script>
</body>
</html>
