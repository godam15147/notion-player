<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: transparent; font-family: Arial, sans-serif; }

.player-box {
    max-width: 620px; margin: auto; background: #d9efff;
    border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    padding: 20px;
}

.now-playing { display: flex; gap: 20px; align-items: center; }
.thumbnail { width: 145px; height: 145px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
.info { flex: 1; min-width: 0; }

.title, .subtitle, .track-title, .track-desc {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.title { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
.subtitle { color: #6b8296; font-size: 14px; line-height: 1.4; }
#statusMsg { font-size: 12px; color: #2b7bc0; margin-top: 4px; font-weight: bold; }

.controls { margin-top: 16px; }
button {
    border: none; background: #4aa8ff; color: white; border-radius: 50%;
    width: 38px; height: 38px; cursor: pointer; margin-right: 8px; font-size: 12px;
}
button:disabled { background: #b0d8ff; cursor: not-allowed; }

/* 재생바 */
.progress-area { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.progress { flex: 1; height: 6px; background: #cfdde8; border-radius: 50px; cursor: pointer; position: relative; }
#progressBar { width: 0%; height: 100%; background: #4aa8ff; border-radius: 50px; position: relative; }
#progressBar::after {
    content: ""; position: absolute; right: -6px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%; background: #4aa8ff;
}
.time-text { width: 45px; font-size: 12px; color: #5b7288; text-align: center; }

/* 플레이리스트 */
.playlist { background: #c7e6fa; padding: 15px; border-radius: 12px; margin-top: 20px; }
.track {
    display: flex; align-items: center; gap: 15px; padding: 10px;
    cursor: pointer; border-radius: 12px; transition: background 0.2s;
}
.track img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.track-text { flex: 1; min-width: 0; }
.track-title { font-size: 15px; font-weight: bold; }
.track-desc { font-size: 13px; color: #6d8295; margin-top: 4px; }

@media(max-width: 600px) {
    .now-playing { flex-direction: column; text-align: center; }
    .thumbnail { width: 180px; height: 180px; }
    .controls { display: flex; justify-content: center; }
}
</style>
</head>

<body>
<div class="player-box">
    <!-- 🚨 유튜브 iframe을 완전히 지우고 오디오 태그만 사용 -->
    <audio id="audioPlayer"></audio>

    <div class="now-playing">
        <img id="main-thumb" class="thumbnail">
        <div class="info">
            <div id="main-title" class="title">로딩중...</div>
            <div id="main-subtitle" class="subtitle">잠시만 기다려주세요</div>
            <div id="statusMsg">음원 준비 중...</div>
            
            <div class="controls">
                <button onclick="changeTrack(-1)">⏮</button>
                <button id="playBtn" onclick="playPause()" disabled>▶</button>
                <button onclick="changeTrack(1)">⏭</button>
            </div>
            
            <div class="progress-area">
                <span id="currentTime" class="time-text">0:00</span>
                <div class="progress" onclick="seek(event)"><div id="progressBar"></div></div>
                <span id="duration" class="time-text">0:00</span>
            </div>
        </div>
    </div>

    <div id="playlist" class="playlist"></div>
</div>

<script>
const tracks = [
    { id: "rR-cvnco5sY", title: "Somply", subtitle: "Feel-Good Jazz Playlist" },
    { id: "V4zgJOsfIYM", title: "Somply", subtitle: "Crystal Clear Dream Wave Jazz" }
];

let current = 0;
const audio = document.getElementById("audioPlayer");
const getThumb = (id) => `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

function initApp() {
    const playlistHTML = tracks.map((track, i) => `
        <div class="track" onclick="selectTrack(${i})">
            <img src="${getThumb(track.id)}">
            <div class="track-text">
                <div class="track-title">${track.title}</div>
                <div class="track-desc">${track.subtitle}</div>
            </div>
        </div>
    `).join('');
    document.getElementById("playlist").innerHTML = playlistHTML;
    loadTrack(0);
}

// 유튜브 ID로부터 실제 오디오 스트림 URL을 추출하여 <audio>에 전달
async function loadTrack(index) {
    current = index;
    const track = tracks[current];
    
    document.getElementById("main-title").innerText = track.title;
    document.getElementById("main-subtitle").innerText = track.subtitle;
    document.getElementById("main-thumb").src = getThumb(track.id);
    document.getElementById("statusMsg").innerText = "음원 연결 중...";
    document.getElementById("playBtn").disabled = true;

    updatePlaylistUI();

    try {
        // 우회 API를 통한 오디오 스트림 URL 받아오기
        const res = await fetch(`https://pipedapi.kavin.rocks/streams/${track.id}`);
        const data = await res.json();
        
        // 오디오 스트림 선택 (m4a / mp4)
        const audioStream = data.audioStreams.find(s => s.mimeType.includes('audio/mp4')) || data.audioStreams[0];
        
        if (audioStream && audioStream.url) {
            audio.src = audioStream.url;
            document.getElementById("statusMsg").innerText = "재생 준비 완료";
            document.getElementById("playBtn").disabled = false;
        } else {
            throw new Error("Audio stream error");
        }
    } catch (err) {
        console.error(err);
        document.getElementById("statusMsg").innerText = "음원 로딩 실패 (다른 곡을 선택해보세요)";
    }
}

function playPause() {
    if (!audio.src) return;
    if (audio.paused) {
        audio.play();
        document.getElementById("playBtn").innerText = "⏸";
    } else {
        audio.pause();
        document.getElementById("playBtn").innerText = "▶";
    }
}

function changeTrack(dir) {
    audio.pause();
    document.getElementById("playBtn").innerText = "▶";
    current = (current + dir + tracks.length) % tracks.length;
    loadTrack(current);
}

function selectTrack(index) {
    audio.pause();
    document.getElementById("playBtn").innerText = "▶";
    loadTrack(index);
}

function updatePlaylistUI() {
    document.querySelectorAll(".track").forEach((item, index) => {
        item.style.background = index === current ? "#E8F5FF" : "transparent";
    });
}

// 표준 HTML5 재생바 및 시간 업데이트 (노션에서도 완벽 작동)
audio.ontimeupdate = function() {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById("progressBar").style.width = `${pct}%`;
    document.getElementById("currentTime").innerText = formatTime(audio.currentTime);
    document.getElementById("duration").innerText = formatTime(audio.duration);
};

audio.onended = function() {
    changeTrack(1);
};

function seek(event) {
    if (!audio.duration) return;
    const rect = event.currentTarget.getBoundingClientRect();
    audio.currentTime = audio.duration * ((event.clientX - rect.left) / rect.width);
}

function formatTime(sec) {
    if (!sec || isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, "0")}`;
}

initApp();
</script>
</body>
</html>
